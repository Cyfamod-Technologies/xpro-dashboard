name: Frontend CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack install --global pnpm@11.0.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:check
      - run: pnpm typecheck
      - run: pnpm build

  notify-failure:
    needs: verify
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord (CI failed)
        # A notification problem must never change the CI result.
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping notification."
            exit 0
          fi
          export RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 - "$DISCORD_WEBHOOK_URL" <<'PY'
          import json, os, sys, urllib.request
          content = (
              f"❌ **xpro-dashboard CI failed** — commit `{os.environ.get('GITHUB_SHA', '')[:7]}` "
              f"on `{os.environ.get('GITHUB_REF_NAME', '')}` ({os.environ.get('GITHUB_EVENT_NAME', '')}).\n"
              f"{os.environ['RUN_URL']}"
          )
          data = json.dumps({"content": content}).encode()
          req = urllib.request.Request(
              sys.argv[1],
              data=data,
              headers={
                  "Content-Type": "application/json",
                  # Discord's Cloudflare front rejects urllib's default
                  # User-Agent with 403 (error 1010).
                  "User-Agent": "xpro-dashboard-ci (+https://github.com/Cyfamod-Technologies/xpro-dashboard)",
              },
          )
          urllib.request.urlopen(req, timeout=15)
          PY
