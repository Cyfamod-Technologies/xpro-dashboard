<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/xpro-logo-transparent.png" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4AA7DF" />
    <title>Xpro</title>
    <link rel="stylesheet" href="/loader.css" />
  </head>
  <body>
    <div id="app">
      <div id="loading-bg">
        <div class="loading-logo" aria-label="Xpro loading">
          <img src="/images/xpro-logo-transparent.png" alt="Xpro" width="208" height="90" />
        </div>
        <div class="loading">
          <div class="effect-1 effects"></div>
          <div class="effect-2 effects"></div>
          <div class="effect-3 effects"></div>
        </div>
      </div>
    </div>

    <script>
      const loaderColor = "#FFFFFF"
      const primaryColor = "#4AA7DF"

      document.documentElement.style.setProperty("--initial-loader-bg", loaderColor)
      document.documentElement.style.setProperty("--initial-loader-color", primaryColor)
      localStorage.setItem("xpro-initial-loader-bg", loaderColor)
      localStorage.setItem("xpro-initial-loader-color", primaryColor)
    </script>
    <script type="module" src="/resources/ts/main.ts"></script>
  </body>
</html>
